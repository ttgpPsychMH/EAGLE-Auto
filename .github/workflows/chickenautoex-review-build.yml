name: EAGLE Auto review build

on:
  push:
    branches: [repair/chickenautoex-107-startup, repair/chickenautoex-107-ui-settings, repair/chickenautoex-107-dungeon-menu, branding/eagle-auto-v0.1, branding/eagle-auto-versioned-build]
    paths:
      - '.github/workflows/chickenautoex-review-build.yml'
      - '.config/dotnet-tools.json'
      - 'ChickenAutoEx.sln'
      - 'global.json'
      - 'EagleAuto.Version.props'
      - 'ChickenAutoEx-new.zip'
      - 'analysis/chickenautoex-107/**'
      - 'analysis/thuy-lao/**'
      - 'src/ChickenAutoEx/**'
      - 'tests/ChickenAutoEx.Startup.Tests/**'
      - 'tools/**'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-package:
    name: Build, test updater, settings and dungeon menus, package for Windows review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.425'
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore pinned tools and packages
        run: |
          dotnet --version
          python -m venv .build/build-venv
          .build/build-venv/bin/python -m pip install -r analysis/chickenautoex-107/tools/requirements.txt
          dotnet tool restore
          dotnet restore ChickenAutoEx.sln --locked-mode
      - name: Recover build assets as data
        run: .build/build-venv/bin/python tools/prepare_build.py
      - name: Read product version for artifact names
        id: product-version
        run: python tools/product_version.py --github-output "$GITHUB_OUTPUT"
      - name: Build net48 Windows application and isolated regression tests
        run: dotnet build ChickenAutoEx.sln -c Release --no-restore
      - name: Verify PE, preserved binaries and licensing source
        run: .build/build-venv/bin/python tools/verify_build.py
      - name: Test updater, settings and dungeon menus with simulated dependencies
        run: dotnet test tests/ChickenAutoEx.Startup.Tests/ChickenAutoEx.Startup.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=startup-tests.trx" --results-directory .build/test-results
      - name: Package verified files for Windows testing
        run: .build/build-venv/bin/python tools/package_build.py
      - name: Upload review ZIP, checksum and validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.product-version.outputs.artifact_name }}
          path: |
            .build/artifacts/${{ steps.product-version.outputs.zip_name }}
            .build/artifacts/${{ steps.product-version.outputs.zip_name }}.sha256
            .build/chickenautoex/verified.json
            .build/test-results/startup-tests.trx
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Explain package status
        env:
          REVIEW_ARTIFACT: ${{ steps.product-version.outputs.artifact_name }}
          REVIEW_EXE: ${{ steps.product-version.outputs.executable }}
        run: |
          echo "Download **$REVIEW_ARTIFACT** from this run's Artifacts section; run **$REVIEW_EXE** on Windows." >> "$GITHUB_STEP_SUMMARY"
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Extract the artifact wrapper, then extract the application ZIP into an isolated Windows test directory.
          This is a review build: Windows 11 runtime testing is still required.
          The isolated updater, UI/settings and dungeon menu tests ran; no game automation executable was executed.
          The package includes the Windows test guide and inherits the original application's embedded constants.
          Do not submit game credentials or use this build as a validated release.
          SUMMARY
